<script>
// scatter pinwheel stars across the screen; each one slides at its own speed
(function () {
  var box = document.querySelector('.stars'), glyphs = '✵✶✷✸✹', out = '';
  for (var i = 0; i < 48; i++) {
    var size = 14 + Math.random() * 34, dur = 50 + Math.random() * 110;
    out += '<span class="' + (Math.random() < 0.3 ? 'purple' : 'silver') + '" style="top:' + Math.random() * 100 + '%;font-size:' + size.toFixed(0) + 'px;animation-duration:' + dur.toFixed(0) + 's;animation-delay:-' + (Math.random() * dur).toFixed(0) + 's">' + glyphs[i % 5] + '</span>';
  }
  box.innerHTML = out;
})();
</script>
