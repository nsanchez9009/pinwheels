<script>
// Pinwheel stars: born at the centre, spiralling outward while orbiting it.
// rotate(angle) translateX(radius) is a polar coordinate, so animating both
// at once interpolates into a spiral. Transform and opacity only, so the
// browser can run the whole thing on the compositor.
(function () {
  var box = document.querySelector('.stars'), kinds = ['s1','s2','s3','p1','p2'], out = '';
  var n = Math.min(110, Math.round(24 + innerWidth * innerHeight / 22000));
  for (var i = 0; i < n; i++) {
    var a    = Math.random() * 360,
        turn = (Math.random() < .5 ? -1 : 1) * (260 + Math.random() * 300),
        r    = 26 + Math.random() * 52,
        rs   = 8 + Math.random() * 62,
        dur  = 34 + Math.random() * 62,
        size = 12 + Math.random() * 30;
    out += '<i class="' + kinds[i % 5] + '" style="'
         + '--a:' + a.toFixed(1) + 'deg;--turn:' + turn.toFixed(1) + 'deg;'
         + '--r:' + r.toFixed(1) + 'vmin;--rs:' + rs.toFixed(1) + 'vmin;'
         + 'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;'
         + 'animation-duration:' + dur.toFixed(0) + 's;'
         + 'animation-delay:-' + (Math.random() * dur).toFixed(0) + 's"></i>';
  }
  box.innerHTML = out;
})();
</script>
